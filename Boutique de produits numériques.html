<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boutique de produits numériques</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7F4;--ink:#10201A;--mut:#4B5C54;--green:#0B6E4F;--gold:#E0A100;--card:#FFFFFF;--line:#D3DCD6;--on:#FFFFFF;--err:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1814;--ink:#EAF2EC;--mut:#A5B7AD;--green:#3DBE8B;--card:#14241E;--line:#26382F;--on:#06130E;--err:#FF8A80}}
:root[data-theme="dark"]{--bg:#0D1814;--ink:#EAF2EC;--mut:#A5B7AD;--green:#3DBE8B;--card:#14241E;--line:#26382F;--on:#06130E;--err:#FF8A80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Source Sans 3",system-ui,sans-serif}
.w{max-width:960px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0}
header{padding:40px 0 28px;border-bottom:4px solid var(--gold)}
h1{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800;letter-spacing:-.02em}
header p{color:var(--mut);margin:10px 0 0}
h2{font-size:1.5rem;font-weight:800;margin:32px 0 14px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{height:110px;background:var(--green);color:var(--on);display:flex;align-items:center;justify-content:center;font-size:2.6rem}
.pb{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pb h3{font-size:1.1rem}
.pb p{margin:0;color:var(--mut);font-size:15px;flex:1}
.pr{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.3rem}
.btn{border:0;background:var(--green);color:var(--on);font:600 16px "Source Sans 3",sans-serif;padding:12px 18px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.s{background:transparent;color:var(--green);border:1px solid var(--green)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#cart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:60px}
.l{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.l .q{display:flex;gap:8px;align-items:center}
.q button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.2rem;padding:14px 0}
label{display:block;margin:12px 0;font-weight:600}
input[type=text],input[type=tel],select{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.err{color:var(--err);min-height:1.3em;margin:8px 0 0}
.ok{border-left:5px solid var(--gold);background:var(--bg);padding:14px 16px;border-radius:4px;margin-top:16px}
.mut{color:var(--mut)}
footer{padding:0 0 40px;color:var(--mut);font-size:15px}
</style>
</head>
<body>
<header><div class="w">
<h1 id="nom-boutique">Ma Boutique Digitale</h1>
<p>Formations, guides et modèles prêts à télécharger. Commande simple par WhatsApp, paiement Mobile Money.</p>
</div></header>
<main class="w">
<h2>Nos produits</h2>
<div class="grid" id="grid"></div>
<h2>Mon panier</h2>
<div id="cart">
<div id="lines"></div>
<div class="tot"><span>Total</span><span id="total">0 FCFA</span></div>
<div id="co">
<label>Votre nom<input type="text" id="nom" autocomplete="name"></label>
<label>Votre numéro WhatsApp<input type="tel" id="tel" autocomplete="tel" placeholder="07 00 00 00 00"></label>
<label>Mode de paiement<select id="pay"></select></label>
<button class="btn" id="go">Envoyer ma commande sur WhatsApp</button>
<p class="err" id="err" role="alert"></p>
</div>
<div id="ok" class="ok" hidden></div>
</div>
</main>
<footer><div class="w">Après paiement, vous recevez votre produit sur WhatsApp.</div></footer>
<script>
/* === À MODIFIER : vos informations === */
var CONFIG={
 boutique:"Ma Boutique Digitale",
 whatsapp:"225XXXXXXXXXX",
 titulaire:"Votre nom",
 paiements:{"Orange Money":"07 00 00 00 00","MTN Money":"05 00 00 00 00","Wave":"07 00 00 00 00","Moov Money":"01 00 00 00 00"}
};
var PRODUITS=[
 {id:"formation",icon:"🏠",nom:"Formation : immobilier locatif en Côte d'Ivoire",desc:"5 leçons, calculateur de rentabilité, liste de vérification et modèle de bail.",prix:25000},
 {id:"coaching",icon:"🎯",nom:"Formation + coaching individuel",desc:"La formation complète plus une séance pour analyser votre premier projet locatif.",prix:60000},
 {id:"cv",icon:"📄",nom:"Pack CV Pro",desc:"Modèles de CV et de lettres de motivation prêts à remplir.",prix:2500},
 {id:"prompts",icon:"🤖",nom:"Guide : 30 meilleurs prompts d'IA",desc:"30 prompts testés pour gagner du temps avec l'IA au quotidien.",prix:1500},
 {id:"recettes",icon:"🍲",nom:"E-book : cuisine africaine légère",desc:"30 recettes africaines plus légères, en 3 parties.",prix:2000}
];
var cart={};
function f(n){return n.toLocaleString("fr-FR")+" FCFA"}
function $(i){return document.getElementById(i)}
document.title=CONFIG.boutique;$("nom-boutique").textContent=CONFIG.boutique;
var grid=$("grid");
PRODUITS.forEach(function(p){
 var d=document.createElement("div");d.className="p";
 d.innerHTML='<div class="ph" aria-hidden="true"></div><div class="pb"><h3></h3><p></p><div class="pr"></div><button class="btn">Ajouter au panier</button></div>';
 d.querySelector(".ph").textContent=p.icon;d.querySelector("h3").textContent=p.nom;d.querySelector("p").textContent=p.desc;d.querySelector(".pr").textContent=f(p.prix);
 d.querySelector("button").onclick=function(){cart[p.id]=(cart[p.id]||0)+1;draw();$("ok").hidden=true};
 grid.appendChild(d)});
Object.keys(CONFIG.paiements).forEach(function(k){var o=document.createElement("option");o.textContent=k;$("pay").appendChild(o)});
function find(id){return PRODUITS.filter(function(p){return p.id===id})[0]}
function draw(){
 var L=$("lines");L.innerHTML="";var t=0,ids=Object.keys(cart).filter(function(i){return cart[i]>0});
 if(!ids.length){L.innerHTML='<p class="mut">Votre panier est vide. Ajoutez un produit ci-dessus.</p>'}
 ids.forEach(function(id){var p=find(id),q=cart[id];t+=p.prix*q;
  var r=document.createElement("div");r.className="l";
  r.innerHTML='<span></span><span class="q"><button aria-label="Retirer">−</button><b>'+q+'</b><button aria-label="Ajouter">+</button></span>';
  r.firstChild.textContent=p.nom+" · "+f(p.prix);
  var b=r.querySelectorAll("button");
  b[0].onclick=function(){cart[id]--;draw()};b[1].onclick=function(){cart[id]++;draw()};
  L.appendChild(r)});
 $("total").textContent=f(t);$("co").style.display=ids.length?"block":"none"}
draw();
$("go").onclick=function(){
 var nom=$("nom").value.trim(),tel=$("tel").value.trim(),err=$("err");
 if(!nom||tel.replace(/\D/g,"").length<8){err.textContent="Entrez votre nom et un numéro WhatsApp valide.";return}
 err.textContent="";
 var t=0,lignes=[];Object.keys(cart).forEach(function(id){if(cart[id]>0){var p=find(id);t+=p.prix*cart[id];lignes.push("- "+p.nom+" x"+cart[id]+" : "+f(p.prix*cart[id]))}});
 var mode=$("pay").value,num=CONFIG.paiements[mode];
 var msg="Bonjour, je souhaite commander :\n"+lignes.join("\n")+"\nTotal : "+f(t)+"\nNom : "+nom+"\nWhatsApp : "+tel+"\nPaiement : "+mode;
 var url="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(msg);
 var ok=$("ok");ok.hidden=false;ok.innerHTML="";
 var h=document.createElement("p");
 h.innerHTML="<strong>Commande prête.</strong> Envoyez <strong>"+f(t)+"</strong> par "+mode+" au <strong>"+num+"</strong> (au nom de "+CONFIG.titulaire+"), puis envoyez la capture du paiement sur WhatsApp.";
 var a=document.createElement("a");a.className="btn";a.href=url;a.target="_blank";a.rel="noopener";a.textContent="Ouvrir WhatsApp";
 ok.appendChild(h);ok.appendChild(a);window.open(url,"_blank")};
</script>
</body>
</html>
