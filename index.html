<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8590c">
<title>AFRI SHOP — Achetez simplement. Recevez rapidement.</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="demo" id="demo" hidden>Produits de démonstration fictifs. Remplacez-les par vos vrais produits depuis l'administration.</div>
<header>
  <div class="row">
    <div class="logo">AFRI<b>SHOP</b></div>
    <input id="q" placeholder="Rechercher (nom, marque, catégorie)" autocomplete="off">
    <button data-act="filt" aria-label="Filtres">⚙️</button>
  </div>
</header>
<main id="m"></main>
<nav class="bar">
  <button data-act="home">🏠<br>Accueil</button>
  <button data-act="favs">♥<br>Favoris</button>
  <button data-act="cart">🛒<br>Panier <span id="cn"></span></button>
  <button data-act="ord">📦<br>Commandes</button>
  <button data-act="acc">👤<br>Compte</button>
  <button data-act="adm" id="adb" hidden>🔧<br>Admin</button>
</nav>
<div id="sh"></div>
<div id="t"></div>
<script src="/app.js" defer></script>
</body>
</html>
